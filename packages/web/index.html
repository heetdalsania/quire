<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#faf4ed" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#232136" media="(prefers-color-scheme: dark)" />
    <title>Quire</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23907aa9'/%3E%3Cpath d='M10 8h9a5 5 0 0 1 5 5v11h-9a5 5 0 0 1-5-5z' fill='%23faf4ed' opacity='.55'/%3E%3Cpath d='M8 10h9a5 5 0 0 1 5 5v11h-9a5 5 0 0 1-5-5z' fill='%23faf4ed'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <aside id="sidebar">
      <header>
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none">
            <path d="M10 6h9a5 5 0 0 1 5 5v13h-9a5 5 0 0 1-5-5z" class="sheet-back" />
            <path d="M7 9h9a5 5 0 0 1 5 5v13H12a5 5 0 0 1-5-5z" class="sheet-front" />
            <path d="M11 15h7M11 19h5" class="sheet-rule" />
          </svg>
        </span>
        <span class="brand">Quire</span>
        <span id="status" class="status"><i class="dot"></i><span class="status-text">connecting</span></span>
      </header>

      <div class="modes" role="tablist" aria-label="Sections">
        <button id="mode-vault" class="mode" role="tab" aria-selected="true">Vault</button>
        <button id="mode-discover" class="mode" role="tab" aria-selected="false">Discover</button>
      </div>

      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="7" cy="7" r="4.5" /><path d="M10.5 10.5 14 14" />
        </svg>
        <input id="search" type="search" placeholder="Search the vault" autocomplete="off" spellcheck="false" />
      </div>

      <nav id="files" aria-label="Documents"></nav>
      <nav id="categories" aria-label="Categories" hidden></nav>

      <section id="backlinks-panel" hidden>
        <h2>Linked from</h2>
        <div id="backlinks"></div>
      </section>
    </aside>

    <section id="discover" hidden>
      <header>
        <h1>Discover</h1>
        <p id="discover-note"></p>
      </header>
      <div id="gallery"></div>
    </section>

    <main>
      <div id="topbar">
        <span id="docpath"></span>
        <div class="toolgroup">
          <button id="comment-btn" class="tool" aria-label="Comment on selection" disabled title="Comment on the selected text">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2z" /></svg>
            <span>Comment</span>
          </button>
          <button id="attr-btn" class="tool" aria-label="Show who wrote what" aria-pressed="false" title="Tint the text by who wrote it">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5 13 13.5H3z" /></svg>
            <span>Authors</span>
          </button>
          <button id="suggest-btn" class="tool" aria-label="Suggesting mode" aria-pressed="false" title="Suggesting mode: your edits become proposals (Cmd+Shift+S)">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M11 2.5 13.5 5 6 12.5H3.5V10z" /></svg>
            <span>Suggesting</span>
          </button>
          <button id="snapshot-btn" class="tool" aria-label="Commit a git snapshot" title="Commit a git snapshot now">
            <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3" /><path d="M8 1.5v3M8 11.5v3M1.5 8h3M11.5 8h3" /></svg>
            <span id="snapshot-label">Snapshot</span>
          </button>
          <button id="share-btn" class="tool" aria-label="Share a link" title="Share this vault">
            <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="12" cy="3.5" r="2"/><circle cx="4" cy="8" r="2"/><circle cx="12" cy="12.5" r="2"/><path d="M5.8 7 10.2 4.6M5.8 9l4.4 2.4"/></svg>
            <span>Share</span>
          </button>
          <button id="export-btn" class="tool" aria-label="Download, print or copy" title="Download, print, or copy">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v8M5 7.2 8 10.4l3-3.2M2.5 13h11" /></svg>
            <span>Export</span>
          </button>
          <button id="display-btn" class="tool" aria-label="Typography and theme" title="Typography and theme">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 12.5 6.6 3.5h1.2l3.6 9M4.6 9.6h5.4M13 12.5V7" /></svg>
            <span>Display</span>
          </button>
        </div>
        <div id="presence"></div>
      </div>

      <div id="split">
        <div id="editor"></div>
        <article id="preview"></article>
      </div>
    </main>

    <aside id="rail">
      <section>
        <h2>Suggestions <span id="sug-count" class="count">0</span></h2>
        <div id="suggestions"></div>
      </section>
      <section>
        <h2>Comments <span id="cmt-count" class="count">0</span></h2>
        <div id="comments"></div>
      </section>
      <section id="agents-section" hidden>
        <h2>Agent contributions</h2>
        <div id="agents"></div>
      </section>
    </aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
